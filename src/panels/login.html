<div class="container">

  <!-- HOME -->
  <div class="login-home login-tabs">

    <h1 class="login-title">Iniciar sesión</h1>

    <div class="login-home-cards">

      <!-- PREMIUM -->
      <button class="connect connect-home connect-button-online login-card">
        <img src="assets/images/masterball.png" alt="Premium">
        <span>Premium</span>
      </button>

      <!-- NO PREMIUM -->
      <button class="connect connect-home connect-button-offline login-card">
        <img src="assets/images/pokeball.png" alt="No Premium">
        <span>No Premium</span>
      </button>

    </div>

    <button class="cancel cancel-home" style="display: none">Cancelar</button>
  </div>

  <!-- LOGIN OFFLINE -->
  <div class="login-offline login-tabs">
    <div class="login-text">Introduce un nombre de usuario</div>
    <div class="input-login">
      <input
        type="text"
        class="email email-offline"
        placeholder="Nombre de usuario"
      />
      <button class="connect connect-offline">Acceder</button>
      <button class="cancel cancel-offline">Cancelar</button>
    </div>
  </div>

  <!-- LOGIN PREMIUM -->
  <div class="login-AZauth login-tabs">
    <div class="login-text">Inicia sesión para jugar.</div>
    <div class="input-login">
      <input type="text" class="email email-AZauth" placeholder="E-mail" />
      <input type="password" class="password password-AZauth" placeholder="Password" />
    </div>
    <div class="login-options">
      <button class="connect connect-AZauth">Confirmar</button>
      <button class="cancel cancel-AZauth" style="display: none">Cancelar</button>
    </div>
  </div>

  <!-- LOGIN A2F -->
  <div class="login-AZauth-A2F login-tabs">
    <div class="login-text">Ingresa el código de seguridad.</div>
    <div class="input-login">
      <input type="text" class="A2F A2F-AZauth" placeholder="Code" />
    </div>
    <div class="login-options">
      <button class="connect connect-AZauth-A2F">Confirmar</button>
      <button class="cancel cancel-AZauth-A2F">Cancelar</button>
    </div>
  </div>

</div>
