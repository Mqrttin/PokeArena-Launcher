<div class="container">
    <div class="status-server">
        <img class="server-status-icon" src="assets/images/icon.png">
        <div class="server-status-infos">
            <div class="server-status-name">Minecraft</div>
            <div class="server-status-text">Cargando...</div>
        </div>
        <div class="status-player-count">
            <div class="player-count">0</div>
        </div>
    </div>

    <!-- Logos posicionados en esquinas y centro arriba -->
<div class="particle-container">
    <img src="assets/images/carrito.png" id="logo-top-left" class="icon">
</div>

<div class="particle-container">
    <img src="assets/images/dc.png" id="logo-top-right" class="icon">
</div>

    <div class="home-bottom">
        <div class="new-tab">
            <div class="news-list content-scroll"></div>
        </div>
    </div>

    <!-- Bottom bar -->
    <div class="bottom-bar">
        <div class="player-section">
            <div class="player-head" data-tooltip="Cuenta"></div>
        </div>

        <div class="play-section">
            <div class="play-instance">
                <button class="play-btn">Jugar</button>
                <div class="instance-select icon-arrow"></div>
            </div>

            <div class="info-starting-game">
                <div class="info-starting-game-text">Descargando...</div>
                <progress value="0" max="100" class="progress-bar"></progress>
            </div>
        </div>

        <div class="settings-section">
            <div class="settings-btn icon-settings"></div>
        </div>
    </div>

<div class="instance-popup">
    <div class="instances-tab">
        <div class="close-popup icon-close"></div>
        <p>Seleccione una instancia</p>

        <div class="instance-grid">

            <!-- C O B B L E M O N -->
            <div class="instance-box" data-type="cobblemon">
                <img src="assets/images/cobblemon.png" class="instance-icon">
                <h2>Cobblemon</h2>
                <div class="instance-buttons">
                    <button class="profile-btn" data-profile="low">Low Profile</button>
                    <button class="profile-btn" data-profile="high">High Profile</button>
                </div>
            </div>

            <!-- P I X E L M O N -->
            <div class="instance-box" data-type="pixelmon">
                <img src="assets/images/pixelmon.png" class="instance-icon">
                <h2>Pixelmon</h2>
                <div class="instance-buttons">
                    <button class="profile-btn" data-profile="low">Low Profile</button>
                    <button class="profile-btn" data-profile="high">High Profile</button>
                </div>
            </div>

        </div>
    </div>
</div>


<script src="assets/js/home.js"></script>
